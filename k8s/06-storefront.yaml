apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecomm
  labels:
    app: storefront
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: medusa-ecommerce
spec:
  type: NodePort
  selector:
    app: storefront
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecomm
  labels:
    app: storefront
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: medusa-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: medusa-ecommerce
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-backend
          image: ecomm-phase2-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for Medusa backend /health at http://backend:9000/health..."
              until curl -sf http://backend:9000/health; do
                sleep 3
              done
              echo "Medusa backend is healthy."
      containers:
        - name: storefront
          image: ecomm-phase2-storefront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: NODE_ENV
            - name: PORT
              value: "8000"
            - name: MEDUSA_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: MEDUSA_BACKEND_URL
            - name: NEXT_PUBLIC_MEDUSA_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
            - name: NEXT_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: NEXT_PUBLIC_BASE_URL
            - name: NEXT_PUBLIC_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: NEXT_PUBLIC_DEFAULT_REGION
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: ecomm-config
                  key: COOKIE_SECURE
            - name: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: ecomm-secrets
                  key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
