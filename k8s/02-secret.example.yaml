# ==============================================================================
# Template Secret Manifest (SAFE TO COMMIT — CONTAINS PLACEHOLDERS ONLY)
# Do NOT put real production secrets in this file.
# To create the runtime secret in the cluster without committing credentials:
#
#   kubectl create secret generic ecomm-secrets -n ecomm \
#     --from-literal=POSTGRES_PASSWORD='<your-postgres-password>' \
#     --from-literal=JWT_SECRET='<your-jwt-secret>' \
#     --from-literal=COOKIE_SECRET='<your-cookie-secret>' \
#     --from-literal=STOREFRONT_PUBLISHABLE_KEY='<your-pk_key>' \
#     --from-literal=NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY='<your-pk_key>'
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ecomm-secrets
  namespace: ecomm
  labels:
    app.kubernetes.io/part-of: medusa-ecommerce
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change_me_local_postgres_password"
  JWT_SECRET: "change_me_jwt_secret_at_least_32_chars"
  COOKIE_SECRET: "change_me_cookie_secret_at_least_32_chars"
  STOREFRONT_PUBLISHABLE_KEY: "pk_replace_with_medusa_publishable_key"
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_replace_with_medusa_publishable_key"
